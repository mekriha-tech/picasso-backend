<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Picasso Admin{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f0f0f0; }
    nav a { margin-right: 1rem; }
    .error { color: #b00020; }
    form.inline { display: inline; }
    input, textarea, select, button { font: inherit; padding: 0.4rem; }
    .badge { padding: 0.15rem 0.5rem; border-radius: 4px; background: #eee; font-size: 0.85em; }
    .notice { color: #1b6e2e; }
    .field-error { color: #b00020; display: block; font-size: 0.9em; }
    .grid { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
    .card { border: 1px solid #ccc; padding: 0.5rem; width: 200px; }
    .card img { width: 100%; height: 150px; object-fit: contain; background: #f6f6f6; }
    .card form { margin: 0.25rem 0; }
    .form-grid label { display: block; margin: 0.75rem 0; }
    .form-grid input, .form-grid textarea, .form-grid select { width: 24rem; max-width: 100%; }
    .danger { color: #b00020; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
